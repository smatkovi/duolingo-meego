[package]
name = "duo-holer"
version = "0.1.0"
edition = "2021"
description = "Eine HTTPS-Anfrage an Duolingo fuer die MeeGo-Fassung"
license = "GPL-3.0-or-later"

[dependencies]
# Qt 4.7 auf Harmattan bringt gegen www.duolingo.com keinen Handschlag
# zustande (OpenSSL von 2011). rustls spricht TLS 1.2 und 1.3 selbst,
# webpki-roots bringt die Wurzeln mit. gzip, weil Duolingo komprimiert und
# eine Lektion sonst ein paar hundert Kilobyte ueber GPRS waeren.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots", "gzip"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

# Ohne diese Zeilen nimmt cargo den x86-Linker des Build-Rechners und bricht
# mit "file in wrong format" ab. rust-lld kommt mit der Rust-Toolchain;
# gelinkt wird statisch gegen Rusts eigenes musl-libc.a.
[target.armv7-unknown-linux-musleabi]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=ld.lld", "-C", "link-self-contained=yes"]
